services:
  - type: web
    name: q3-guardrail
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: Q3_SECRET
        value: /home/agent/.secrets
      - key: Q3_WRITE_ROOT
        value: /srv/reports
      - key: Q3_ALLOWED_HOSTS
        value: registry.npmjs.org,api.github.com
